<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoomLink - Home</title>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #0f172a; color: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; padding: 20px; }
        .container { max-width: 400px; }
        h2 { margin-bottom: 10px; color: #ffffff; }
        p { color: #94a3b8; font-size: 15px; line-height: 1.5; margin-bottom: 25px; }
        .btn { display: none; background-color: #017a6b; color: #ffffff; padding: 14px 28px; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 16px; box-shadow: 0 4px 12px rgba(1, 122, 107, 0.4); }
        .btn.show { display: inline-block; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Opening RoomLink...</h2>
        <p id="desc">Taking you to the home screen. If the app doesn't open automatically, click below.</p>
        <a id="storeBtn" class="btn" href="#">View on Play Store</a>
    </div>
    <script>
        (function () {
            var playStore = "https://play.google.com/store/apps/details?id=com.roomlink.app";
            var ua = navigator.userAgent || navigator.vendor || window.opera;
            var isAndroid = /android/i.test(ua);
            var isIOS = /ipad|iphone|ipod/.test(ua) && !window.MSStream;
            var appOpened = false;
            setTimeout(function () {
                if (appOpened || document.hidden) return;
                if (isAndroid || isIOS) {
                    window.location.href = playStore;
                } else {
                    window.location.href = "https://roomlink.homes";
                }
            }, 1500);
        })();
    </script>
</body>
</html>
