<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opening RoomLink Profile...</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f1f5f9;
      padding: 24px;
      color: #0f172a;
    }
    .card {
      background: #fff;
      width: 100%;
      max-width: 420px;
      border-radius: 20px;
      padding: 40px 28px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(15, 23, 42, 0.08);
    }
    .logo {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #036dd6;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 10px;
    }
    p {
      font-size: 15px;
      line-height: 1.5;
      color: #64748b;
      margin-bottom: 24px;
    }
    .btn {
      display: none;
      width: 100%;
      text-decoration: none;
      border-radius: 12px;
      padding: 15px 20px;
      font-size: 16px;
      font-weight: 700;
      background: #036dd6;
      color: #fff;
    }
    .btn.show { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">RoomLink</div>
    <h1 id="title">Opening profile...</h1>
    <p id="desc">Taking you to RoomLink.</p>
    <a id="storeBtn" class="btn" href="https://play.google.com/store/apps/details?id=com.roomlink.app">
      Get RoomLink on Play Store
    </a>
  </div>

  <script>
    (function () {
      var path = window.location.pathname || "";
      var parts = path.split("/").filter(Boolean);
      var userId = parts[0] === "profile" ? (parts[1] || "") : "";

      var title = document.getElementById("title");
      var desc = document.getElementById("desc");
      var storeBtn = document.getElementById("storeBtn");
      var playStore = "https://play.google.com/store/apps/details?id=com.roomlink.app";

      if (!userId) {
        title.textContent = "Profile not found";
        desc.textContent = "This link is invalid.";
        storeBtn.classList.add("show");
        storeBtn.href = playStore;
        return;
      }

      var deepLink = "roomlink://profile/" + encodeURIComponent(userId);

      // Android Intent URL:
      // - opens app if installed
      // - otherwise goes straight to Play Store
      var androidIntent =
        "intent://profile/" + encodeURIComponent(userId) +
        "#Intent;scheme=roomlink;package=com.roomlink.app;" +
        "S.browser_fallback_url=" + encodeURIComponent(playStore) +
        ";end";

      var isAndroid = /android/i.test(navigator.userAgent);
      var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);

      var appOpened = false;

      // If user leaves the page, assume app opened
      function onVisibilityChange() {
        if (document.hidden) appOpened = true;
      }
      document.addEventListener("visibilitychange", onVisibilityChange);

      if (isAndroid) {
        // Best Android behavior
        window.location.href = androidIntent;
      } else {
        // iOS / desktop: try custom scheme first
        window.location.href = deepLink;
      }

      // Fallback if app did not open
      setTimeout(function () {
        if (appOpened || document.hidden) return;

        // App likely not installed
        if (isAndroid || isIOS) {
          window.location.href = playStore;
        } else {
          // Desktop: show button instead of auto-redirect
          title.textContent = "Open in RoomLink";
          desc.textContent = "Install the app to view this profile.";
          storeBtn.classList.add("show");
          storeBtn.href = playStore;
        }
      }, 1500);
    })();
  </script>
</body>
</html>
