<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoomLink Listing</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            padding: 50px 20px;
            background: #f4f6f8;
            color: #333;
        }
        .card {
            background: white;
            padding: 40px 30px;
            border-radius: 16px;
            max-width: 420px;
            margin: auto;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
        }
        h2 { color: #111; margin-bottom: 10px; }
        p { color: #666; font-size: 15px; }
        .btn {
            display: inline-block;
            background: #107a6b;
            color: white;
            padding: 14px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 24px;
        }
        .btn-secondary {
            display: inline-block;
            margin-top: 16px;
            color: #107a6b;
            font-weight: 600;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>RoomLink Property</h2>
        <p id="listingIdText">Loading...</p>
        <a id="appButton" href="#" class="btn">Open in RoomLink App</a>
        <br>
        <a
          id="storeButton"
          href="https://play.google.com/store/apps/details?id=com.roomlink.app"
          class="btn-secondary"
        >
            Don't have the app? Download it
        </a>
    </div>

    <script>
        const pathSegments = window.location.pathname.split('/').filter(Boolean);
        const listingId = pathSegments[pathSegments.length - 1];
        const textEl = document.getElementById('listingIdText');
        const appButton = document.getElementById('appButton');
        const storeUrl = 'https://play.google.com/store/apps/details?id=com.roomlink.app';

        const isAndroid = /android/i.test(navigator.userAgent);
        const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);

        if (listingId && listingId !== 'listing') {
            textEl.innerText = 'Open this property in the RoomLink app';

            if (isAndroid) {
                // Opens app if installed, otherwise Play Store
                appButton.href =
                    'intent://listing/' + listingId +
                    '#Intent;scheme=roomlink;package=com.roomlink.app;' +
                    'S.browser_fallback_url=' + encodeURIComponent(storeUrl) +
                    ';end';
            } else if (isIOS) {
                // Try app scheme; if it fails, user can use Download link
                appButton.href = 'roomlink://listing/' + listingId;
                appButton.addEventListener('click', function (e) {
                    e.preventDefault();
                    window.location.href = 'roomlink://listing/' + listingId;
                    setTimeout(function () {
                        // Optional: App Store link when you have one
                        window.location.href = storeUrl;
                    }, 2000);
                });
            } else {
                // Desktop / other
                appButton.href = storeUrl;
                appButton.innerText = 'Get RoomLink on Play Store';
            }
        } else {
            textEl.innerText = 'Property not found.';
            appButton.style.display = 'none';
        }
    </script>
</body>
</html>
