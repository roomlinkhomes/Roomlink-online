<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoomLink Listing</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            padding: 50px 20px;
            background: #f4f6f8;
            color: #333;
        }
        .card {
            background: white;
            padding: 40px 30px;
            border-radius: 16px;
            max-width: 420px;
            margin: auto;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
        }
        h2 { color: #111; margin-bottom: 10px; }
        p { color: #666; font-size: 15px; }
        .btn {
            display: inline-block;
            background: #107a6b;
            color: white;
            padding: 14px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 24px;
        }
        .btn-secondary {
            display: inline-block;
            margin-top: 12px;
            color: #107a6b;
            font-weight: 600;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>RoomLink Property</h2>
        <p id="listingIdText">Loading property details...</p>
        <a id="appButton" href="#" class="btn">Open in RoomLink App</a>
        <br>
        <a id="storeButton" href="https://play.google.com/store/apps/details?id=com.roomlink.app" class="btn-secondary">
            Don't have the app? Download it
        </a>
    </div>

    <script>
        const pathSegments = window.location.pathname.split('/').filter(Boolean);
        // path is like ["listing", "ABC123"]
        const listingId = pathSegments[pathSegments.length - 1];

        const appButton = document.getElementById('appButton');
        const textEl = document.getElementById('listingIdText');

        if (listingId && listingId !== 'listing') {
            textEl.innerText = 'Open this property in the RoomLink app';
            const appUrl = 'roomlink://listing/' + listingId;
            const storeUrl = 'https://play.google.com/store/apps/details?id=com.roomlink.app';

            appButton.href = appUrl;

            appButton.addEventListener('click', function (e) {
                e.preventDefault();

                // Try to open the app
                window.location.href = appUrl;

                // If app doesn't open, go to Play Store after 1.5s
                setTimeout(function () {
                    window.location.href = storeUrl;
                }, 1500);
            });
        } else {
            textEl.innerText = 'Property not found.';
            appButton.style.display = 'none';
        }
    </script>
</body>
</html>
