<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoomLink - Feed</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  
  <style>
    body { 
      font-family: Arial, sans-serif; 
      background: #f4f4f4; 
      margin: 0; 
      padding: 10px; 
    }
    .container { 
      max-width: 800px; 
      margin: auto; 
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 5px 15px;
      margin-bottom: 10px;
    }
    .logo {
      font-size: 26px;
      font-weight: bold;
      color: #017a6b;
      margin: 0;
    }
    .search-icon-header {
      font-size: 26px;
      color: #017a6b;
      cursor: pointer;
      padding: 5px;
    }

    /* Search Bar (Hidden by default) */
    .search-bar {
      display: none;
      align-items: center;
      background: white;
      border-radius: 12px;
      padding: 8px 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .search-bar.active {
      display: flex;
    }
    .search-input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 16px;
      padding: 8px 10px;
    }
    .search-close {
      font-size: 24px;
      color: #666;
      cursor: pointer;
      padding: 5px;
    }

    /* Banner Section */
    .banner-section {
      margin-bottom: 25px;
    }
    .banner {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      margin-bottom: 15px;
      position: relative;
    }
    .banner img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }
    .banner-label {
      position: absolute;
      top: 12px;
      left: 12px;
      background: #017a6b;
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .listing {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      transition: transform 0.2s;
      cursor: pointer;
    }
    .listing:hover {
      transform: translateY(-3px);
    }
    .listing img {
      width: 100%;
      height: 140px;
      object-fit: cover;
    }
    .info {
      padding: 12px;
    }
    .title { 
      font-size: 15px; 
      font-weight: bold; 
      margin: 0 0 6px 0; 
      line-height: 1.3;
    }
    .price { 
      color: #017a6b; 
      font-size: 17px; 
      font-weight: bold; 
    }
    .location { 
      color: #555; 
      font-size: 13px; 
      margin-top: 4px;
    }

    .loading, .empty { 
      text-align: center; 
      padding: 60px 20px; 
      color: #666; 
      font-size: 16px; 
    }
    .error { 
      color: red; 
      text-align: center; 
      padding: 40px 20px; 
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Header -->
    <div class="header">
      <h1 class="logo">RoomLink</h1>
      <span class="search-icon-header" id="searchIcon">🔍</span>
    </div>

    <!-- Search Bar -->
    <div class="search-bar" id="searchBar">
      <input 
        type="text" 
        id="searchInput" 
        class="search-input" 
        placeholder="Search by title, location..."
        onkeyup="filterListings()"
      >
      <span class="search-close" id="closeSearch">✕</span>
    </div>

    <!-- Banner Section -->
    <div class="banner-section" id="bannerSection"></div>

    <div id="loading" class="loading">Loading feed...</div>
    <div id="feed" class="grid"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyATm08xqtzXsiftaxlq9zvB7pPPXaePDTI",
      authDomain: "roomlink-homes.firebaseapp.com",
      projectId: "roomlink-homes",
      storageBucket: "roomlink-homes.firebasestorage.app",
      messagingSenderId: "796064439495",
      appId: "1:796064439495:web:6b99c970d933238967f2e2",
      measurementId: "G-3G5QVNNR7K"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let allListings = [];

    async function loadFeed() {
      const loadingDiv = document.getElementById('loading');

      try {
        const bannerSnap = await db.collection("ads")
          .where("status", "==", "active")
          .get();

        const banners = [];
        bannerSnap.forEach(doc => {
          const data = doc.data();
          if (data.type === "banner" || data.type === "Banner") {
            banners.push(data);
          }
        });

        renderBanners(banners);

        const listingSnap = await db.collection("listings")
          .orderBy("createdAt", "desc")
          .limit(50)
          .get();

        loadingDiv.style.display = "none";

        if (listingSnap.empty && banners.length === 0) {
          document.getElementById('feed').innerHTML = `<div class="empty">No listings available at the moment.</div>`;
          return;
        }

        allListings = [];
        listingSnap.forEach(doc => {
          allListings.push({ id: doc.id, ...doc.data() });
        });

        renderListings(allListings);

      } catch (err) {
        console.error("Error loading feed:", err);
        loadingDiv.style.display = "none";
        document.getElementById('feed').innerHTML = `<div class="error">Failed to load feed.</div>`;
      }
    }

    function renderBanners(banners) {
      const container = document.getElementById('bannerSection');
      if (banners.length === 0) return;

      let html = "";
      banners.forEach(banner => {
        const img = banner.image || "https://via.placeholder.com/800x200?text=Banner";
        html += `
          <div class="banner" onclick="openAppStore()">
            <span class="banner-label">Sponsored</span>
            <img src="${img}" alt="Banner">
          </div>
        `;
      });
      container.innerHTML = html;
    }

    function renderListings(listings) {
      const feedDiv = document.getElementById('feed');
      let html = "";

      listings.forEach(d => {
        let img = "https://via.placeholder.com/300x200?text=No+Image";
        if (d.images && Array.isArray(d.images) && d.images.length > 0) {
          img = d.images[0];
        } else if (d.image) {
          img = d.image;
        }

        html += `
          <div class="listing" onclick="openAppStore()">
            <img src="${img}" alt="${d.title || 'Property'}">
            <div class="info">
              <div class="title">${d.title || "Untitled Listing"}</div>
              <div class="price">₦${(d.price || 0).toLocaleString()}</div>
              <div class="location">${d.location || "Location not available"}</div>
              <small>${d.propertyType || ""} ${d.category ? `• ${d.category}` : ""}</small>
            </div>
          </div>
        `;
      });

      feedDiv.innerHTML = html;
    }

    function filterListings() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
      
      if (!searchTerm) {
        renderListings(allListings);
        return;
      }

      const filtered = allListings.filter(listing => {
        const title = (listing.title || "").toLowerCase();
        const location = (listing.location || "").toLowerCase();
        const category = (listing.category || "").toLowerCase();
        return title.includes(searchTerm) || location.includes(searchTerm) || category.includes(searchTerm);
      });

      renderListings(filtered);
    }

    // Search Toggle
    function toggleSearch() {
      const searchBar = document.getElementById('searchBar');
      const searchInput = document.getElementById('searchInput');
      
      searchBar.classList.toggle('active');
      
      if (searchBar.classList.contains('active')) {
        searchInput.focus();
      } else {
        searchInput.value = '';
        renderListings(allListings);
      }
    }

    function openAppStore() {
      window.open("https://play.google.com/store/apps/details?id=com.roomlink.app", "_blank");
    }

    // Event Listeners
    document.getElementById('searchIcon').addEventListener('click', toggleSearch);
    document.getElementById('closeSearch').addEventListener('click', toggleSearch);

    window.onload = loadFeed;
  </script>
</body>
</html>
