<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoomLink Banner Promotion</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f8f9fa; margin: 0; padding: 15px; }
    .container { max-width: 600px; margin: auto; background: white; border-radius: 12px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #017a6b; }
    .plan { padding: 18px; margin: 12px 0; border: 2px solid #eee; border-radius: 12px; cursor: pointer; transition: all 0.3s; }
    .plan:hover { background: #f8f9fa; }
    .plan.selected { border-color: #017a6b; background: #e6f7f0; }
    label { display: block; margin-top: 15px; font-weight: bold; color: #333; }
    input, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
    textarea { resize: vertical; min-height: 80px; }
    button { width: 100%; padding: 15px; background: #017a6b; color: white; border: none; border-radius: 10px; font-size: 17px; font-weight: bold; margin-top: 20px; cursor: pointer; }
    button:disabled { background: #aaa; cursor: not-allowed; }
    #debug { margin-top: 20px; padding: 15px; background: #f0f0f0; border-radius: 8px; font-size: 13px; white-space: pre-wrap; color: #333; display: none; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Promote Your Business</h2>
    <p style="text-align:center; color:#555;">Banner / Billboard Promotion</p>

    <div id="plans"></div>

    <div id="infoSection" style="display:none; margin-top:20px;">
      <label>Email Address <span style="color:red;">*</span></label>
      <input type="email" id="userEmail" placeholder="your@email.com" required>

      <label>Business / Brand Name <span style="color:red;">*</span></label>
      <input type="text" id="businessName" placeholder="e.g. Emma's Bakery" required>

      <label>Ad Description (Optional)</label>
      <textarea id="adDescription" placeholder="Brief description of your banner..."></textarea>
    </div>

    <button id="payBtn" disabled onclick="handlePayment()">Proceed to Payment</button>

    <div id="debug"></div>
  </div>

  <script>
    const plans = [
      { id: "daily", title: "24 Hours", price: 500 },
      { id: "weekly", title: "7 Days", price: 3500 },
      { id: "monthly", title: "30 Days", price: 10500 }
    ];

    let selectedPlan = null;

    function renderPlans() {
      const container = document.getElementById("plans");
      container.innerHTML = plans.map(plan => `
        <div class="plan" data-id="${plan.id}">
          <h3>${plan.title}</h3>
          <h2>₦${plan.price.toLocaleString()}</h2>
        </div>
      `).join("");

      document.querySelectorAll('.plan').forEach(el => {
        el.addEventListener('click', () => {
          document.querySelectorAll('.plan').forEach(p => p.classList.remove('selected'));
          el.classList.add('selected');
          selectedPlan = plans.find(p => p.id === el.dataset.id);
          document.getElementById('infoSection').style.display = 'block';
          document.getElementById('payBtn').disabled = false;
        });
      });
    }

    async function handlePayment() {
      const email = document.getElementById('userEmail').value.trim();
      const businessName = document.getElementById('businessName').value.trim();
      const adDescription = document.getElementById('adDescription').value.trim();
      const debug = document.getElementById('debug');

      if (!email || !email.includes('@')) return alert("Please enter a valid email");
      if (!businessName) return alert("Please enter your Business/Brand Name");
      if (!selectedPlan) return alert("Please select a plan");

      const adId = `banner_web_${Date.now()}`;   // ← Important

      const payload = {
        email: email,
        amount: selectedPlan.price * 100,
        reference: `banner_${Date.now()}`,
        adId: adId,                    // ← Sending adId like the app
        plan: selectedPlan.id,
        metadata: {
          type: "banner_promotion",
          email: email,
          businessName: businessName,
          plan: selectedPlan.id,
          adDescription: adDescription || "",
          source: "web"
        }
      };

      const btn = document.getElementById('payBtn');
      btn.disabled = true;
      btn.textContent = "Connecting...";

      try {
        debug.style.display = "block";
        debug.innerHTML = `Payload:\n${JSON.stringify(payload, null, 2)}\n\n`;

        const response = await fetch(
          "https://us-central1-roomlink-homes.cloudfunctions.net/initializePaystack",
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          }
        );

        const data = await response.json();
        debug.innerHTML += `Server Response:\n${JSON.stringify(data, null, 2)}\n`;

        if (data.url || data.authorization_url) {
          debug.innerHTML += "\n✅ Redirecting...";
          window.location.href = data.url || data.authorization_url;
        } else {
          alert("Payment failed. Check debug.");
        }
      } catch (err) {
        debug.innerHTML += `❌ Error: ${err.message}`;
        alert("Connection error");
      } finally {
        btn.disabled = false;
        btn.textContent = "Proceed to Payment";
      }
    }

    window.onload = renderPlans;
  </script>
</body>
</html>
